<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Dev Public Resume</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Um modelo de currículo público para desenvolvedores."
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <!-- Projeto pensado para ser hospedado no GitHub Pages, permitindo ao desenvolvedor compartilhar seu currículo publicamente e melhora-lo conforme necessário. -->
    <main class="container py-5">
        <section id="profile" class="profile-wrapper mb-5"></section>
        <section id="projects" class="mb-5">
            <h2 class="section-title">Projetos</h2>
            <div class="row g-4" id="projects-list"></div>
        </section>
        <section id="experience" class="mb-5">
            <h2 class="section-title">Experiência</h2>
            <div class="timeline" id="experience-list"></div>
        </section>
        <section id="skills" class="mb-5">
            <h2 class="section-title">Skills</h2>
            <div class="row g-4" id="skills-list"></div>
        </section>
        <section id="contact" class="mb-5">
            <h2 class="section-title">Contato</h2>
            <div class="contact-cards" id="contact-list"></div>
        </section>
    </main>
    
    <script src="assets/js/main.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/render-profile.js"></script>
    <script src="assets/js/render-projects.js"></script>
    <script src="assets/js/render-experience.js"></script>
    <script src="assets/js/render-skills.js"></script>
    <script src="assets/js/render-contacts.js"></script>
    <script src="assets/js/scroll-revel.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/pdf.js"></script>
</body>

</html>
